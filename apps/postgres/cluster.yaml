apiVersion: v1
kind: Namespace
metadata:
  name: db
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-lab
  namespace: db
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # Saat versi image diubah, operator melakukan rolling update:
  # replika dulu, lalu switchover, lalu bekas primary.
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: appdb
      owner: appuser
      # secret password dibuat otomatis: pg-lab-app

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "16MB"
      maintenance_work_mem: "256MB"
      random_page_cost: "1.1"
      wal_level: "logical"          # dibutuhkan untuk migrasi nanti
      max_wal_size: "2GB"
      log_min_duration_statement: "500"   # catat query > 500 ms
    pg_hba:
      - host appdb appuser all scram-sha-256
    synchronous:
      method: any          # kuorum: berapa pun dari daftar kandidat
      number: 1            # minimal 1 standby harus mengonfirmasi
      # dataDurability: required   # default: primary berhenti menulis
      #                            # kalau tidak ada standby yang sehat

  storage:
    size: 20Gi
    # storageClass: db-retain
  walStorage:
    size: 10Gi
    # storageClass: db-retain

  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      memory: "2Gi"        # = requests → QoS Guaranteed
      # cpu SENGAJA tidak diisi

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred    # 'required' untuk produksi

  monitoring:
    enablePodMonitor: false           # jadikan true setelah Prometheus terpasang
